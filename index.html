<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./MB_logo.ico" />
  <link rel="manifest" href="./manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedBudget</title>
  <script type="module" crossorigin src="./assets/index-CHmrDewO.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-D8WGEz6W.css">
</head>

<body>
  <div id="root"></div>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/service-worker.js")
          .then((registration) => {
            console.log(
              "ServiceWorker registration successful with scope: ",
              registration.scope
            );
          })
          .catch((error) => {
            console.log(
              "ServiceWorker registration failed: ",
              error
            );
          });
      });
    }
  </script>
</body>

</html>
